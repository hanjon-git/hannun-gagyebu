name: 개인용 Apps Script 연결 확인
on: workflow_dispatch
permissions: {}
jobs:
  check:
    if: github.repository == 'hanjon-git/hannun-gagyebu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: personal
    timeout-minutes: 3
    steps:
      - name: Google 인증 및 운영 배포 조회
        env:
          GOOGLE_AUTH: ${{ secrets.HN_GOOGLE_OAUTH }}
          SCRIPT_ID: ${{ secrets.HN_SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.HN_DEPLOYMENT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          async function check() {
            const { GOOGLE_AUTH, SCRIPT_ID, DEPLOYMENT_ID } = process.env;
            if (!GOOGLE_AUTH || !SCRIPT_ID || !DEPLOYMENT_ID) throw Error('개인용 연결값 등록 필요');
            const {client_id, client_secret, refresh_token} = JSON.parse(GOOGLE_AUTH);
            if (!client_id || !client_secret || !refresh_token) throw Error('Google 인증 항목 누락');
            const auth = await fetch('https://oauth2.googleapis.com/token', {
              method: 'POST', redirect: 'error',
              body: new URLSearchParams({client_id, client_secret, refresh_token, grant_type: 'refresh_token'})
            });
            if (!auth.ok) throw Error('Google 인증 실패 HTTP ' + auth.status);
            const {access_token} = await auth.json();
            if (!access_token) throw Error('Google 인증 응답 확인 필요');
            const deployment = await fetch('https://script.googleapis.com/v1/projects/' +
              encodeURIComponent(SCRIPT_ID) + '/deployments/' + encodeURIComponent(DEPLOYMENT_ID),
              {headers: {Authorization: 'Bearer ' + access_token}, redirect: 'error'});
            if (!deployment.ok) throw Error('운영 배포 조회 실패 HTTP ' + deployment.status);
            const {deploymentId, deploymentConfig} = await deployment.json();
            if (deploymentId !== DEPLOYMENT_ID || deploymentConfig?.scriptId !== SCRIPT_ID ||
                !Number.isInteger(deploymentConfig?.versionNumber)) throw Error('운영 배포 대상 확인 필요');
            console.log('개인용 연결 확인 완료. 운영 버전 ' + deploymentConfig.versionNumber);
          }
          check().catch(error => {
            console.error(error.message.startsWith('Google ') || /^(개인용|운영) /.test(error.message)
              ? error.message : '연결 설정 또는 통신 확인 필요');
            process.exitCode = 1;
          });
          NODE
