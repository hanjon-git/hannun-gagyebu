<style>

  .s-ok{color:#2F9E44;font-weight:700}.s-over{color:#E8590C;font-weight:700}.s-under{color:#2F9E44}.s-wait{color:#ADB5BD}

      b.querySelector('#aGo').onclick = function () {
        var o = { item: b.querySelector('#aItem').value }; if (bi) { var v = numOf(bi); if (v == null) { toast('잔액을 입력'); return; } if (v !== L.cur) o.base = v; }
        edRun('setAcctRow', ['loan', row, key, o], function () { L.item = o.item; edClose(); toast('저장 · 다시 계산 중'); var rb = document.getElementById('reload'); if (rb && !rb.disabled) rb.click(); });
      };
    });
  }

  function chkClose() { var a = document.getElementById('chkDim'), b = document.getElementById('chkSheet'); if (a) a.remove(); if (b) b.remove(); }

  function closeCp() { if (CP) { CP.remove(); CP = null; } }
  function toast(t) { var el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2200); }
  // 예산 바꾸기: ✎ → 입력칸 → 저장 = 가계부설정 B4
  document.getElementById('gauge').addEventListener('click', function (e) {
    if (e.target.closest('#planLine')) { setTab('계획'); document.getElementById('tabs').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (e.target.closest('#editLimit')) {
      var cur = (DATA.gauge && DATA.gauge.limit) || 800000;
      document.getElementById('limK').innerHTML = (+CUR.slice(5, 7)) + '월 예산 <input class="limin" id="limIn" inputmode="numeric" value="' + num(cur) + '"><button class="edit" id="limOk">저장</button>';
      var inp = document.getElementById('limIn'); inp.focus(); inp.select();
      inp.onkeydown = function (k) { if (k.key === 'Enter') saveLimit(); if (k.key === 'Escape') render(); };
    } else if (e.target.closest('#limOk')) saveLimit();
  });
  function saveLimit() {
    var n = Math.round(+String(document.getElementById('limIn').value).replace(/[^\d]/g, ''));
    if (!(n >= 10000 && n <= 100000000)) { toast('1만~1억 사이로 입력'); return; }
    var done = function () { DATA.gauge = DATA.gauge || { noti: null }; DATA.gauge.limit = n; render(); toast('예산 ' + num(n) + '원'); };
    if (window.google && google.script && google.script.run) GSR().withSuccessHandler(done).withFailureHandler(function (err) { toast('저장 실패: ' + err.message); }).setBudget(n);
    else done();
  }

  document.getElementById('tb').addEventListener('click', function (e) { var b = e.target.closest('.tagbtn'); if (!b) { rowTap(e); return; } e.stopPropagation(); if (b.dataset.inc != null) typePop(b); else catPop(b); });
  document.getElementById('flowSw').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b || S.flow === b.dataset.f) return; S.flow = b.dataset.f; detail(ROWS.filter(bySrc).filter(inPeriod)); });
  document.getElementById('dayBox').addEventListener('click', function (e) { var b = e.target.closest('.tagbtn'); if (!b) { rowTap(e); return; } e.stopPropagation(); if (b.dataset.inc != null) typePop(b); else catPop(b); });
  document.getElementById('tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setTab(b.dataset.t); });
  document.getElementById('calBox').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.cm) { var m = addMonth(S.cm, +b.dataset.cm); if (m < FIRST || m > CUR) return; S.cm = m; S.day = null; calBlock(); return; }
    if (b.dataset.d) { S.day = b.dataset.d; calBlock(); }
  });
  document.addEventListener('click', closeCp);

  document.getElementById('fCat').addEventListener('scroll', catEnd);
  // PC: 분류 줄을 마우스로 끌어서 옆으로 이동, 휠도 가로로 (폰은 원래 손가락으로 밀림)
  (function () {
    var el = document.getElementById('fCat'), d = null, moved = false;
    el.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse' || e.button !== 0) return; d = { x: e.clientX, s: el.scrollLeft }; moved = false; });
    window.addEventListener('pointermove', function (e) {
      if (!d) return;
      var dx = e.clientX - d.x;
      if (!moved && Math.abs(dx) > 4) { moved = true; el.classList.add('drag'); }
      if (moved) el.scrollLeft = d.s - dx;
    });
    window.addEventListener('pointerup', function () { if (!d) return; d = null; el.classList.remove('drag'); });
    el.addEventListener('click', function (e) { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);   // 끈 뒤에는 칩 클릭으로 치지 않음
    el.addEventListener('wheel', function (e) {
      if (el.scrollWidth <= el.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
      el.scrollLeft += e.deltaY; e.preventDefault();
    }, { passive: false });
  })();
  document.getElementById('calBtn').onclick = function (e) { e.stopPropagation(); CAL.open ? calClose() : calOpen(); };
  document.getElementById('calPop').onclick = function (e) {
    e.stopPropagation();
    var b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.y) { CAL.year += +b.dataset.y; drawCal(); } else if (b.dataset.m) calPick(b.dataset.m);
  };
  document.addEventListener('click', function () { if (CAL.open) calClose(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && CAL.open) calClose(); });
  document.getElementById('prevW').onclick = function () { shift(-1); };
  document.getElementById('nextW').onclick = function () { shift(1); };
  document.getElementById('q').addEventListener('input', function (e) { S.q = e.target.value; S.limit = 30; detail(ROWS.filter(bySrc).filter(inPeriod)); });
  document.getElementById('more').onclick = function () { S.limit += 30; detail(ROWS.filter(bySrc).filter(inPeriod)); };
  document.getElementById('reload').onclick = function () {
    if (!(window.google && google.script && google.script.run)) return;
    var b = this, t0 = Date.now(); b.textContent = '불러오는 중…'; b.disabled = true;
    GSR().withSuccessHandler(function (json) { b.textContent = '새로고침'; b.disabled = false; load(JSON.parse(json)); perf({ type: '새로고침', trip: Date.now() - t0 }); })
      .withFailureHandler(function (err) { b.textContent = '새로고침'; b.disabled = false; alert('불러오기 실패: ' + err.message); }).getDashboardJson();
  };

  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  var RS = parseFloat(getComputedStyle(document.documentElement).fontSize) / 16 || 1;   // 폰 비율 (390px 폭 = 1)
  Chart.defaults.font.size = Math.round(12 * RS);
  var RW = window.innerWidth <= 520;   // 폰↔PC 폭이 바뀌면 내역 열 다시 (화면 회전·창 크기)
  window.addEventListener('resize', function () { var m = window.innerWidth <= 520; if (m !== RW) { RW = m; render(); } });
  Chart.defaults.color = '#6B7684';
  load(DATA);
  // 속도 측정: 처음 열기 = 이 페이지 스크립트 시작부터 화면 다 그릴 때까지 (서버 쪽 시간은 대시보드.gs가 따로 잼)
  function perf(c) { try { if (window.google && google.script && google.script.run) GSR().logPerf(PERF_ID, c); } catch (e) {} }
  (function () {
    var c = { type: CACHE_AGE ? '처음 열기(저장본)' : '처음 열기', start: T_START, render: Date.now() - T_START };
    setTimeout(function () {
      try { var tm = performance.timing; c.nav = { fetchToResp: tm.responseStart - tm.fetchStart, resp: tm.responseEnd - tm.responseStart, toDom: tm.domContentLoadedEventEnd - tm.fetchStart, cacheAgeSec: Math.round(CACHE_AGE / 1000), font: FONT_OK ? 'saved' : 'fetch' }; } catch (e) {}
      perf(c); PERF_ID = '';
    }, 300);
  })();
  // 저장본으로 그렸으면 뒤에서 새로 계산해 바뀐 게 있으면 다시 그림 (1분 안에 만든 저장본이면 생략)
  if (CACHE_AGE > 60000 && window.google && google.script && google.script.run) {
    var st = document.getElementById('stamp'), st0 = st.textContent, tb = Date.now(), before = JSON.stringify(DATA);
    st.textContent = st0 + ' · 갱신 중…';
    GSR().withSuccessHandler(function (json) {
      perf({ type: '뒤에서 갱신', trip: Date.now() - tb });
      if (json !== before) load(JSON.parse(json)); else st.textContent = st0;
    }).withFailureHandler(function () { st.textContent = st0; }).getDashboardJson();
  }
  // 폰트: 저장본이 없으면 화면을 그린 뒤 받아서 넣고 저장 → 차트를 그 글꼴로 다시 그림
  if (!FONT_OK && window.google && google.script && google.script.run) {
    GSR().withSuccessHandler(function (css) {
      if (!css) return;
      var el = document.createElement('style'); el.textContent = css; document.head.appendChild(el);
      try { localStorage.setItem(FONT_KEY, css); } catch (e) {}
      try { document.fonts.load('600 12px PretendardEmbed').then(function () { Chart.defaults.font.family = getComputedStyle(document.body).fontFamily; render(); }); } catch (e) {}
    }).getDashFont();
  }
})();
</script>
</body>
</html>
